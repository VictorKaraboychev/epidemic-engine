name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to publish a GitHub release with that version's
# changelog notes and the package. The tag must match package.json's version.
on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Tag matches the version
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run validate
            - run: npm run check:api
            - run: npm run check:package
            - run: npm run check:browser
            - run: npm run check:consumer
            - run: npm pack
            - name: Release notes from the changelog
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
                  test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md epidemic-engine-*.tgz
